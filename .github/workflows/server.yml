name: server

on:
  push:
    branches: [master, dev, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tuvi
          POSTGRES_PASSWORD: tuvi
          POSTGRES_DB: tuvi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tuvi" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - name: Test (PGlite)
        run: npm test
      - name: Test tài khoản/admin trên PostgreSQL thật
        run: npx vitest run test/account.test.ts
        env:
          TEST_DATABASE_URL: postgres://tuvi:tuvi@localhost:5432/tuvi
      - name: Đối chiếu engine Node ⇄ Python (phải khớp 100%)
        run: npm run crossval -- --n 2000 --seed ${{ github.run_number }}
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'dev')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # tên nhánh được chuẩn hoá (feat/x → feat-x)
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'dev') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
